spring.application.name=travel-with-asanka

# --- MongoDB (works with the default MongoDB Compass connection) ---
spring.data.mongodb.uri=mongodb://localhost:27017/travelwithasanka
spring.data.mongodb.auto-index-creation=true

server.port=8080

# --- Uploads ---
app.upload-dir=uploads
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=12MB

# --- Admin sign in (change these before going live) ---
app.admin.username=admin
app.admin.password=asanka@2026

# --- Token signing key: replace with a long random string in production ---
app.jwt.secret=change-this-to-a-long-random-secret-key-at-least-32-characters
app.jwt.expiration-hours=12

# --- Origins allowed to call the API ---
app.cors-origins=http://localhost:5173,http://localhost:4173,http://localhost:3000

spring.jackson.serialization.write-dates-as-timestamps=false
